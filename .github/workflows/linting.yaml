---
name: Linting

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  linting:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/linting@0b639e02a4da2b33342095fc0196c37b8079abe5 # v0
        with:
          pre-commit-config: ./.pre-commit-config.yaml
